<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMentor IA</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="app-layout" aria-label="CodeMentor IA">
        <button class="history-toggle" type="button" id="history-toggle">Historico</button>
        <div class="history-backdrop" id="history-backdrop" hidden></div>
        <aside class="history-sidebar" id="history-sidebar" aria-label="Historico de conversas" aria-hidden="true">
            <div class="history-header">
                <div>
                    <p class="eyebrow">Historico</p>
                    <h2>Conversas</h2>
                </div>
                <div class="history-actions">
                    <button class="ghost-button" type="button" id="new-chat-button">Nova</button>
                    <button class="ghost-button" type="button" id="history-close-button">Fechar</button>
                </div>
            </div>
            <div class="history-list" id="history-list">
                <p class="history-empty">Nenhuma conversa salva ainda.</p>
            </div>
        </aside>

        <section class="chat-shell" aria-label="Chat CodeMentor IA">
            <header class="chat-header">
                <div>
                    <p class="eyebrow">Engenharia de Inteligencia Artificial</p>
                    <h1>CodeMentor IA</h1>
                </div>
                <div class="header-actions">
                    <button class="ghost-button" type="button" id="theme-button" title="Alternar tema">Tema</button>
                    <button class="ghost-button" type="button" id="clear-button" title="Limpar conversa">Limpar</button>
                    <span class="status">Online</span>
                </div>
            </header>

        <section class="chat-messages" id="chat-messages" aria-live="polite">
            <div class="welcome-panel" id="welcome-panel">
                <p class="welcome-kicker">Pronto para programar melhor</p>
                <h2>Como posso ajudar no seu codigo hoje?</h2>
                <p>Escolha uma linguagem, selecione uma categoria, envie codigo ou anexe uma imagem para analise.</p>
                <div class="suggestions" aria-label="Sugestoes de perguntas">
                    <button type="button" data-suggestion="Explique orientacao a objetos em Java com um exemplo simples.">Orientacao a objetos</button>
                    <button type="button" data-suggestion="Corrija este codigo e explique o erro passo a passo.">Corrigir codigo</button>
                    <button type="button" data-suggestion="Crie uma API REST em Java com exemplo de rota, service e controller.">Criar API em Java</button>
                    <button type="button" data-suggestion="Explique como depurar um erro comum em Python.">Ajuda com debug</button>
                </div>
            </div>
        </section>

        <form class="chat-form" id="chat-form">
            <div class="composer-tools">
                <button class="plus-button" type="button" id="tools-button" aria-label="Abrir opcoes">+</button>
                <div class="tools-popover" id="tools-popover" hidden>
                    <label>
                        Linguagem
                        <select id="language-select">
                            <option>Geral</option>
                            <option>Java</option>
                            <option>Python</option>
                            <option>JavaScript</option>
                            <option>HTML/CSS</option>
                            <option>SQL</option>
                            <option>C#</option>
                        </select>
                    </label>

                    <label>
                        Categoria
                        <select id="category-select">
                            <option>Geral</option>
                            <option>Logica</option>
                            <option>APIs</option>
                            <option>Banco de Dados</option>
                            <option>Debug</option>
                            <option>Testes</option>
                            <option>Boas praticas</option>
                            <option>Arquitetura</option>
                        </select>
                    </label>

                    <label class="file-control">
                        Arquivo ou imagem
                        <span class="file-picker">
                            <input id="code-file" type="file" accept=".txt,.py,.java,.js,.ts,.html,.css,.json,.sql,.cs,.xml,.png,.jpg,.jpeg,.webp">
                            <span class="file-button">Anexar</span>
                            <span class="file-name" id="file-name">Nenhum arquivo</span>
                        </span>
                    </label>
                </div>
            </div>
            <label class="sr-only" for="message-input">Mensagem</label>
            <textarea
                id="message-input"
                name="message"
                rows="1"
                placeholder="Digite sua duvida de programacao..."
                autocomplete="off"
            ></textarea>
            <button type="submit" id="send-button">Enviar</button>
        </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
